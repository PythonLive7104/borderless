<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>404 — Page not found</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem;
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#0b1220; color:#e5e7eb; }
  .card { text-align:center; max-width:30rem; }
  .code { font-size:3.5rem; font-weight:800; letter-spacing:-.02em; color:#3b82f6; margin:0 0 .25rem; }
  h1 { font-size:1.4rem; margin:0 0 .6rem; font-weight:600; }
  p { color:#9ca3af; line-height:1.65; margin:0 auto; max-width:24rem; }
  .tag { display:inline-block; margin-top:1.75rem; font-size:.7rem; letter-spacing:.08em;
    text-transform:uppercase; color:#6b7280; }
  .report { display:block; margin-top:1.1rem; font-size:.82rem; color:#6b7280; }
  .report a { color:#9ca3af; text-decoration:underline; text-underline-offset:2px; }
  .report a:hover { color:#e5e7eb; }
</style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or is no longer available.</p>
    <p class="report">Received this link in a suspicious message?
      <a id="report-link" href="/report">Report it</a>.</p>
    <div class="tag">Protected by TryNoBot</div>
  </main>
  <script>
    // Pre-fill the report form with the link the visitor actually landed on.
    var a = document.getElementById("report-link");
    if (a) a.href = "/report?url=" + encodeURIComponent(location.href);
  </script>
</body>
</html>
