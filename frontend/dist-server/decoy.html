<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Welcome</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem;
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f8fafc; color:#334155; }
  .card { max-width:34rem; text-align:center; }
  .spinner { width:34px; height:34px; margin:0 auto 1.25rem; border:3px solid #e2e8f0;
    border-top-color:#94a3b8; border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-size:1.5rem; margin:0 0 .5rem; color:#1e293b; }
  p { color:#64748b; line-height:1.6; margin:.25rem auto; max-width:26rem; }
</style>
</head>
<body>
  <main class="card">
    <div class="spinner"></div>
    <h1>Just a moment…</h1>
    <p>We're getting things ready. This page will continue loading shortly.</p>
    <p>Thanks for your patience.</p>
  </main>
</body>
</html>
