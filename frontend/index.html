<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0f1d" />
    <!-- Installable from the browser: home-screen icon, own window, no address
         bar. Same build as the website, so there is no second codebase. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TryNoBot" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Applies the saved theme BEFORE first paint. Inline and synchronous on
         purpose: anything deferred lets the page paint in the wrong theme and
         then snap, which is worse than either theme on its own. The markup
         ships dark, so this only has to act for visitors who chose light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tnb_theme");
          if (t === "light") document.documentElement.setAttribute("data-theme", "light");
        } catch (e) { /* private mode: keep the default */ }
      })();
    </script>
    <meta name="description" content="TryNoBot — See every visitor. Score every click. Protect every campaign. Real-time traffic intelligence, fraud detection and campaign analytics." />
    <title>TryNoBot — Traffic Intelligence & Fraud Detection</title>
    <link rel="canonical" href="https://trynobot.com/" />
    <meta property="og:site_name" content="TryNoBot" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trynobot.com/" />
    <meta property="og:title" content="TryNoBot — Traffic Intelligence & Fraud Detection" />
    <meta property="og:description" content="Real-time bot detection and traffic intelligence for people who buy traffic." />
    <meta property="og:image" content="https://trynobot.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TryNoBot — see every visitor, score every click, protect every campaign." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://trynobot.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
