<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Access denied</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem;
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#0b1220; color:#e5e7eb; }
  .card { text-align:center; max-width:30rem; }
  .icon { width:66px; height:66px; margin:0 auto 1.25rem; }
  h1 { font-size:1.7rem; margin:0 0 .6rem; letter-spacing:-.01em; }
  p { color:#9ca3af; line-height:1.65; margin:0 auto; max-width:24rem; }
  .tag { display:inline-block; margin-top:1.75rem; font-size:.7rem; letter-spacing:.08em;
    text-transform:uppercase; color:#6b7280; }
</style>
</head>
<body>
  <main class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>
    </svg>
    <h1>Access denied</h1>
    <p>Automated or suspicious traffic isn't allowed here. If you believe this is a mistake, please try again from a standard web browser.</p>
    <div class="tag">Protected by TryNoBot</div>
  </main>
</body>
</html>
