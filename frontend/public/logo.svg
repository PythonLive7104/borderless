<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512"
     role="img" aria-label="TryNoBot">
  <title>TryNoBot</title>
  <defs>
    <!-- Namespaced id. A bare "bl" collides when a directory inlines several
         vendor logos into one document, and the loser renders black. -->
    <linearGradient id="tnb-logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#tnb-logo-grad)"/>
  <path d="M16 5l8 3v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V8z"
        fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/>
  <polyline points="8.5,16 12,16 14,11.5 17,20.5 19,16 23.5,16"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
