# Borderless production reverse proxy.
#
# Single public entrypoint that fans out to the two planes:
#   /api, /admin, /static  -> Django control plane (backend:8000)
#   /bl.js, /v1            -> Go decision/data plane (decision:8080)
#   everything else        -> built React app (served from /usr/share/nginx/html)
#
# TLS/JA3: to populate the JA3 fingerprint the decision engine reads, terminate
# TLS with a JA3-capable build (nginx with the ja3 module, or HAProxy) and set
# `proxy_set_header X-JA3-Hash $http_ssl_ja3;` on the /v1 location. Behind
# Cloudflare, the CF-JA3-Hash header is passed through automatically.

upstream backend  { server backend:8000; }
upstream decision { server decision:8080; }

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    # --- Control plane (Django) ---
    location /api/   { proxy_pass http://backend;  include /etc/nginx/proxy.inc; }
    location /admin/ { proxy_pass http://backend;  include /etc/nginx/proxy.inc; }
    location /static/ { proxy_pass http://backend; include /etc/nginx/proxy.inc; }

    # --- Data plane (Go engine): tracker script + event collection ---
    location = /bl.js { proxy_pass http://decision; include /etc/nginx/proxy.inc; }
    location /v1/     { proxy_pass http://decision; include /etc/nginx/proxy.inc; }

    # --- Frontend SPA (built assets) ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
