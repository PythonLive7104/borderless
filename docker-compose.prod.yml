# Production stack. Single public entrypoint (web/nginx on :80); everything else
# is internal. Put Cloudflare or a TLS-terminating proxy in front for HTTPS.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required .env for prod: DJANGO_DEBUG=0, DJANGO_ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS,
# CSRF_TRUSTED_ORIGINS, FRONTEND_URL, TRACKER_URL, DATABASE_URL, REDIS_URL.

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-borderless}
      POSTGRES_USER: ${POSTGRES_USER:-borderless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-borderless}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-borderless}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi -b 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile - --error-logfile -"
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  decision:
    build: ./decision
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: ./backend
    command: sh -c "sleep 8 && python manage.py consume_traffic"
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # NOTE: Celery worker + beat were removed to save ~130 MB of RAM on this
  # 1.6 GB VPS. Their only jobs were two maintenance tasks, now run from host
  # cron via management commands (see deploy/README.md):
  #   0 3 * * *  enforce_retention   (daily data cleanup)
  #   0 * * * *  sync_ja3            (hourly JA3 blocklist refresh)
  # To restore Celery, re-add the celery-worker/celery-beat services here.

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_TAWK_SRC: ${VITE_TAWK_SRC:-}
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_FILTER: DOMAIN   # only substitute ${DOMAIN}; leave $host, $uri etc.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - decision
    restart: unless-stopped

  # Renews the Let's Encrypt cert every 12h (webroot). Initial cert is issued by
  # deploy/init-letsencrypt.sh.
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    restart: unless-stopped

volumes:
  pgdata:
